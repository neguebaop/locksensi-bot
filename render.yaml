services:
  - type: web
    name: locksensi-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: MISTICPAY_CLIENT_ID
        sync: false
      - key: MISTICPAY_CLIENT_SECRET
        sync: false
      - key: MISTICPAY_FERNET_KEY
        sync: false
      - key: MISTICPAY_WEBHOOK_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STORE_URL
        sync: false
      - key: FEEDBACK_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: OAUTH_TOKEN_ENCRYPTION_KEY
        sync: false
